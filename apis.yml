aid: liftlab
name: LiftLab
description: >-
  LiftLab (LiftLab Analytics, Inc.) is a marketing measurement and capital
  allocation platform for enterprise marketing, analytics, and finance leaders.
  Its Two-Stage Agile Marketing Mix Model (AMM) separates ad marketplace auction
  dynamics — CPM/CPC volatility and competitive pressure — from true consumer
  demand response, producing channel response curves and marginal ROI (mROAS)
  that are not contaminated by marketplace noise. A geo-based Incrementality
  Testing Suite feeds causal results back into the model through the Trust
  Engine as permanent calibration inputs, PlatformSense applies live ad platform
  data to those stable curves for daily channel intelligence, the Scenario
  Planner turns model output into constraint-aware, finance-ready budget plans,
  and Miles AI answers natural-language questions grounded in the model. LiftLab
  serves D2C/ecommerce, CPG, and omnichannel retail brands including Pandora,
  Cinemark, Quicken, SKIMS, and Thrive Market. Headquartered in Oakland, CA;
  SOC 2 Type II and ISO 27001:2013 certified, GDPR and CCPA compliant. LiftLab
  publishes no developer portal, no API documentation and no OpenAPI, but it
  does operate one undocumented machine surface: an OAuth-protected Model
  Context Protocol endpoint at https://connect.liftlab.com/server/api/mcp,
  advertised through RFC 8414 and RFC 9728 discovery documents on its own
  hostname and scoped for a Claude connector. That host is a white-labeled
  TapClicks deployment, so the agent surface is served by LiftLab but supplied
  by a vendor.
