note: >-
  Revised 2026-08-13. The 2026-07-19 round recorded every interface standard as
  unknown on the grounds that LiftLab publishes no public API. The organizational
  compliance findings stand unchanged, but the interface findings did not: a
  certificate-transparency sweep of *.liftlab.com surfaced connect.liftlab.com,
  which serves RFC 8414 and RFC 9728 discovery documents protecting an MCP
  endpoint. OAuth 2.0, PKCE and the two metadata RFCs are therefore now asserted
  from probed machine documents rather than left unknown. Standards that still
  cannot be observed (RFC 9457, pagination, idempotency) remain unknown because
  the API behind the OAuth wall is not reachable anonymously — LiftLab still
  publishes no OpenAPI and no developer documentation.
standards:
- id: soc2-type2
  conforms: true
  evidence: >-
    Trust center (liftlab-analytics-inc.trust.site) and /llms.txt both state
    "SOC 2 Type II" certified.
- id: iso-27001
  conforms: true
  evidence: >-
    Trust center and /llms.txt state "ISO 27001:2013 certified".
- id: gdpr
  conforms: true
  evidence: /llms.txt and /about/ state "GDPR and CCPA compliant".
- id: ccpa
  conforms: true
  evidence: /llms.txt and /about/ state "GDPR and CCPA compliant".
- id: llms-txt
  conforms: true
  evidence: >-
    https://liftlab.com/llms.txt returns 200 with a structured llms.txt document;
    /robots.txt explicitly allows it and allows GPTBot, ClaudeBot, PerplexityBot.
- id: rfc9116-security-txt
  conforms: false
  evidence: >-
    /.well-known/security.txt and /security.txt return 404 on liftlab.com, 404 on
