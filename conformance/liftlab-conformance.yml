    on any LiftLab host.
- id: oauth2
  conforms: true
  evidence: >-
    https://connect.liftlab.com/.well-known/oauth-authorization-server returns 200
    with OAuth 2.0 authorization-server metadata — issuer
    https://connect.liftlab.com, authorization_code + client_credentials +
    refresh_token grants, response_type code. The protected endpoint
    https://connect.liftlab.com/server/api/mcp returns 401 with a correct Bearer
    challenge. Note: liftlab.com itself still returns 404 for this path; the
    surface is on connect.liftlab.com.
- id: rfc8414-as-metadata
  conforms: true
  evidence: >-
    https://connect.liftlab.com/.well-known/oauth-authorization-server returns 200
    application/json with a conformant RFC 8414 document.
- id: rfc9728-protected-resource-metadata
  conforms: true
  evidence: >-
    https://connect.liftlab.com/.well-known/oauth-protected-resource returns 200
    naming resource https://connect.liftlab.com/server/api/mcp, and the 401 from
    that resource carries
    WWW-Authenticate: Bearer resource_metadata="https://connect.liftlab.com/.well-known/oauth-protected-resource"
    — the full RFC 9728 discovery loop.
- id: rfc7636-pkce
  conforms: true
  evidence: >-
    code_challenge_methods_supported ["S256"] in the authorization-server metadata.
- id: mcp
  conforms: true
  evidence: >-
    An OAuth-protected Model Context Protocol endpoint is live at
    https://connect.liftlab.com/server/api/mcp (401 + Bearer challenge to an
    anonymous tools/list). Tool list is auth-gated and was not enumerated.
    The deployment is a white-labeled TapClicks portal on LiftLab's hostname —
    see mcp/liftlab-mcp.yml for the ownership finding.
- id: oidc
  conforms: false
  evidence: >-
    /.well-known/openid-configuration returns 404 on both liftlab.com and
    connect.liftlab.com. The auth surface is plain OAuth 2.0, not OpenID Connect.
