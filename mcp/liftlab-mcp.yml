tools: []
tools_note: >-
  The live tool list is auth-gated and was NOT captured. An anonymous
  POST {"jsonrpc":"2.0","id":1,"method":"tools/list"} returns HTTP 401
  {"error":true,"data":["Please login to access the API"],"status":401} with a
  correct RFC 9728 challenge header
  WWW-Authenticate: Bearer resource_metadata="https://connect.liftlab.com/.well-known/oauth-protected-resource".
  An initialize call returns the same 401. Enumerating the real tools and their
  inputSchema requires an authenticated OAuth token from a LiftLab customer
  account; LiftLab publishes no tool list anywhere public, so none is recorded
  here. No candidate tools were derived because there is no OpenAPI to derive
  them from.

