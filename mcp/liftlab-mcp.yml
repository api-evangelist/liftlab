# ---------------------------------------------------------------------------
# OWNERSHIP / PROVENANCE — read before trusting this artifact (pipeline STEP 0c)
# ---------------------------------------------------------------------------
ownership:
  verdict: served-by-provider-on-vendor-platform
  statement: >-
    connect.liftlab.com is LiftLab's own hostname — the Let's Encrypt
    certificate is issued to CN=connect.liftlab.com with that single SAN — and
    every endpoint the discovery documents advertise is issued under
    https://connect.liftlab.com, so the agent surface is reachable at and
    attributed to LiftLab. The underlying platform is NOT LiftLab-built: the
    hostname is a CNAME to liftlabtrial.tapclicks.com ->
    tapcore-web-prod-simple.tapclicks.com, i.e. a white-labeled TapClicks
    reporting portal, and the JSON error envelope and /client/dist/ +
    /server/api/ path layout are TapClicks' application. Recorded as LiftLab's
    surface because LiftLab serves it under its own domain and OAuth issuer,
    with the vendor stated plainly rather than implied.
  evidence:
  - fact: DNS CNAME chain
    value: connect.liftlab.com -> liftlabtrial.tapclicks.com -> tapcore-web-prod-simple.tapclicks.com
  - fact: TLS certificate subject
    value: CN=connect.liftlab.com (Let's Encrypt, SAN = connect.liftlab.com only)
  - fact: OAuth issuer
    value: https://connect.liftlab.com
  vendor: TapClicks
  built_by_provider: false

status: live
