method: probed
source: >-
  Live probes of liftlab.com, connect.liftlab.com and backend.liftlab.com.
  Host list expanded on 2026-08-13 from certificate-transparency enumeration of
  *.liftlab.com (api.certspotter.com), which surfaced hosts the 2026-07-19 round
  could not guess.
note: >-
  UPGRADE over the 2026-07-19 round, which probed only liftlab.com and recorded
  "no /.well-known/ documents anywhere". That was true of the marketing host and
  is still true. It was NOT true of the company: connect.liftlab.com serves two
  real, parsing JSON discovery documents (RFC 8414 authorization-server metadata
  and RFC 9728 protected-resource metadata) that advertise an OAuth-protected
  MCP endpoint. Those are genuine 200s carrying real documents, so a WellKnown
  pointer IS warranted this round. No security.txt is served on any host, so no
  SecurityTxt pointer is emitted.

hosts:

- host: https://connect.liftlab.com
  role: >-
    LiftLab Connect portal — a white-labeled TapClicks deployment on LiftLab's
    own hostname. Carries the only machine-readable discovery documents LiftLab
    serves anywhere.
  documents:
  - path: /.well-known/oauth-authorization-server
    status: 200
    content_type: application/json
    file: liftlab-oauth-authorization-server.json
    real_document: true
    summary: >-
      RFC 8414 metadata. issuer https://connect.liftlab.com; authorize/token
      endpoints under /server/api/mcp/; PKCE S256; grants authorization_code,
      client_credentials, refresh_token; scopes_supported ["claudeai"].
  - path: /.well-known/oauth-protected-resource
    status: 200
    content_type: application/json
    file: liftlab-oauth-protected-resource.json
    real_document: true
    summary: >-
      RFC 9728 metadata. resource https://connect.liftlab.com/server/api/mcp;
      authorization_servers ["https://connect.liftlab.com"]; bearer via header.
